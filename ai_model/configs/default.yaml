seed: 42
data:
  plantvillage_dir: data/plantvillage
  plantdoc_dir: data/plantdoc
  plantdoc_class_map: data/plantdoc/plantdoc_class_map.json
  min_images_per_class: 20
  min_side_px: 64
  max_image_bytes: 10485760 # 10 MB
  max_pixels: 50000000
  split: {train: 0.70, val: 0.15, test: 0.15}
  output_dir: artifacts
  group_regex: "(_flipTB|_flipLR|_90deg|_180deg|_270deg|_newGRR|_Scaled|__\\d+)"
  near_duplicate_hash: false

image:
  size: 224
  resize_mode: squash # squash | center_crop

model:
  dropout: 0.2
  imagenet_weights_path: null # null = auto-download; or local path for offline use

training:
  batch_size: 32
  epochs_head: 5 # phase 1: frozen base
  epochs_finetune: 5 # phase 2: partial unfreeze (0 to skip)
  learning_rate_head: 0.001
  learning_rate_finetune: 0.00001
  fine_tune_layers: 30
  use_class_weights: false
  early_stopping_patience: 3
  deterministic: false
  max_train_samples: null
  mixed_precision: false

inference:
  confidence_threshold: 0.70
  min_margin: 0.10
  top_k: 3
  threshold_calibrated: false
